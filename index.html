<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CELESTIA ✦ A Cozy Fantasy World</title>

<link rel="stylesheet" href="style.css">

</head>
  
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;
  background:#17162b;
  font-family:'DM Sans',sans-serif;
  color:#fff;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}

/* ================= TOP BAR ================= */

.topbar{
  position:absolute;
  z-index:20;
  top:16px;
  left:18px;
  right:18px;
  height:66px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:rgba(42,31,67,.78);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(14px);

  border-radius:20px;
  box-shadow:0 12px 40px rgba(0,0,0,.22);
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo .star{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#ffd7ec,#d7c4ff);
  color:#6b4b9d;
  font-size:21px;
  box-shadow:0 5px 18px rgba(255,190,230,.3);
}

.logo h1{
  font-family:'Playfair Display',serif;
  font-size:22px;
  letter-spacing:2px;
}

.logo span{
  display:block;
  font-size:9px;
  opacity:.65;
  letter-spacing:1.5px;
  margin-top:-2px;
}

.status{
  display:flex;
  align-items:center;
  gap:9px;
}

.pill{
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px 13px;
  border-radius:14px;
  background:rgba(255,255,255,.1);
  font-size:12px;
  border:1px solid rgba(255,255,255,.08);
}

.playerBadge{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  background:rgba(255,215,105,.12);
  border:1px solid rgba(255,215,105,.35);
  border-radius:14px;
  font-size:12px;
}

.crown{
  font-size:17px;
}

/* ================= OUTFIT PANEL ================= */

.outfit{
  position:absolute;
  z-index:30;
  top:96px;
  right:18px;
  width:250px;
  padding:17px;

  background:rgba(43,31,64,.9);
  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.15);
  border-radius:24px;

  box-shadow:0 18px 55px rgba(0,0,0,.3);

  transition:.3s ease;
}

.outfit.closed{
  transform:translateX(270px);
}

.outfitHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.outfitHead h2{
  font-size:14px;
}

.closeOutfit{
  border:0;
  background:rgba(255,255,255,.1);
  color:#fff;
  width:28px;
  height:28px;
  border-radius:9px;
  cursor:pointer;
}

.characterPreview{
  height:170px;
  border-radius:18px;
  background:
    radial-gradient(circle at 50% 30%,rgba(255,255,255,.4),transparent 35%),
    linear-gradient(145deg,#c8b9f1,#f1bfd9);

  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:hidden;
}

.characterPreview:after{
  content:"✦  ✧  ✦  ✧  ✦";
  position:absolute;
  bottom:13px;
  font-size:13px;
  opacity:.5;
  letter-spacing:5px;
}

.previewCharacter{
  position:relative;
  z-index:2;
  transform:scale(1.65);
}

.sectionTitle{
  margin:14px 0 8px;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.4px;
  opacity:.55;
}

.options{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.option{
  height:46px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  background:rgba(255,255,255,.07);
  color:#fff;
  cursor:pointer;
  font-size:20px;
  transition:.18s;
}

.option:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.14);
}

.option.active{
  border-color:#ffd2ec;
  background:rgba(255,210,236,.16);
  box-shadow:0 0 0 2px rgba(255,210,236,.08);
}

.saveOutfit{
  width:100%;
  margin-top:13px;
  padding:11px;
  border:0;
  border-radius:13px;
  cursor:pointer;

  background:linear-gradient(135deg,#f0a9cf,#bca5ed);
  color:#3c294f;
  font-weight:700;
}

/* ================= BOTTOM UI ================= */

.bottomLeft{
  position:absolute;
  z-index:20;
  left:18px;
  bottom:18px;

  display:flex;
  flex-direction:column;
  gap:9px;
}

.controls{
  padding:11px 14px;
  border-radius:15px;
  background:rgba(38,30,58,.78);
  border:1px solid rgba(255,255,255,.12);
  font-size:11px;
  backdrop-filter:blur(10px);
}

.controls b{
  color:#ffd5ec;
}

.interact{
  min-width:220px;
  display:none;
  padding:12px 16px;
  border-radius:15px;
  background:rgba(255,239,211,.94);
  color:#4a3453;
  font-size:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.interact.show{
  display:block;
}

/* ================= MINIMAP ================= */

.minimap{
  position:absolute;
  z-index:20;
  right:18px;
  bottom:18px;
  width:180px;
  height:125px;

  padding:8px;

  background:rgba(40,30,60,.86);
  border:1px solid rgba(255,255,255,.15);
  border-radius:18px;
  backdrop-filter:blur(12px);
}

.minimap canvas{
  position:relative;
  width:100%;
  height:100%;
  border-radius:11px;
}

/* ================= OUTFIT BUTTON ================= */

.openOutfit{
  position:absolute;
  z-index:25;
  right:18px;
  top:96px;

  display:none;

  border:0;
  border-radius:15px;
  padding:11px 14px;
  background:#f0bfdc;
  color:#51365d;
  font-weight:700;
  cursor:pointer;
}

/* ================= TOAST ================= */

.toast{
  position:absolute;
  z-index:50;
  top:92px;
  left:50%;
  transform:translate(-50%,-20px);
  opacity:0;

  padding:12px 18px;
  border-radius:15px;

  background:rgba(42,31,67,.94);
  border:1px solid rgba(255,255,255,.14);

  font-size:12px;
  pointer-events:none;
  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================= DIALOG ================= */

.dialog{
  position:absolute;
  z-index:60;
  left:50%;
  bottom:30px;
  transform:translateX(-50%);
  width:min(620px,calc(100% - 30px));

  display:none;

  padding:18px 20px;

  background:rgba(45,32,64,.96);
  border:1px solid rgba(255,255,255,.16);
  border-radius:22px;

  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.dialog.show{
  display:block;
}

.dialogName{
  color:#ffd2e9;
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
}

.dialogText{
  font-size:14px;
  line-height:1.6;
}

.dialogHint{
  margin-top:9px;
  font-size:10px;
  opacity:.45;
}

/* ================= MOBILE ================= */

@media(max-width:750px){

  .topbar{
    top:8px;
    left:8px;
    right:8px;
    height:55px;
  }

  .logo h1{
    font-size:17px;
  }

  .logo span{
    display:none;
  }

  .pill{
    display:none;
  }

  .outfit{
    top:72px;
    right:8px;
    width:220px;
  }

  .openOutfit{
    display:block;
    top:72px;
    right:8px;
  }

  .outfit:not(.closed) + .openOutfit{
    display:none;
  }

  .minimap{
    display:none;
  }

  .controls{
    font-size:9px;
  }

  .dialog{
    bottom:15px;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="world"></canvas>

<!-- TOP -->
<div class="topbar">

  <div class="logo">
    <div class="star">✦</div>
    <div>
      <h1>CELESTIA</h1>
      <span>A COZY FANTASY WORLD</span>
    </div>
  </div>

  <div class="status">
    <div class="pill">☀️ Day 1 · 10:24 AM</div>
    <div class="pill">☁️ Cloudhaven</div>
    
  <div class="playerBadge">
  <span class="crown">👑</span>
  <div>
    <b>Eunseorin</b>
    <small>Kanja · Creator</small>
  </div>
</div>

</div>

<!-- OUTFIT -->
<div class="outfit" id="outfitPanel">

  <div class="outfitHead">
    <h2>✦ MY OUTFITS</h2>
    <button class="closeOutfit" onclick="toggleOutfit()">×</button>
  </div>

  <div class="characterPreview">
    <div class="previewCharacter" id="previewCharacter"></div>
  </div>

  <div class="sectionTitle">Hair</div>

  <div class="options" id="hairOptions">
    <button class="option active" data-value="brown">🤎</button>
    <button class="option" data-value="black">🖤</button>
    <button class="option" data-value="purple">💜</button>
    <button class="option" data-value="pink">🩷</button>
  </div>

  <div class="sectionTitle">Outfit</div>

  <div class="options" id="dressOptions">
    <button class="option active" data-value="lavender">👗</button>
    <button class="option" data-value="pink">🎀</button>
    <button class="option" data-value="blue">🩵</button>
    <button class="option" data-value="cream">🤍</button>
  </div>

  <div class="sectionTitle">Accessory</div>

  <div class="options" id="accessoryOptions">
    <button class="option active" data-value="flower">🌸</button>
    <button class="option" data-value="bow">🎀</button>
    <button class="option" data-value="crown">👑</button>
    <button class="option" data-value="star">⭐</button>
  </div>

  <button class="saveOutfit" onclick="saveOutfit()">SAVE OUTFIT ✦</button>

</div>

<button class="openOutfit" onclick="toggleOutfit()">👗 Outfit</button>

<!-- BOTTOM -->
<div class="bottomLeft">

  <div class="interact" id="interactBox">
    Press <b>E</b> to interact
  </div>

  <div class="controls">
    <b>WASD / ARROW</b> Move &nbsp; · &nbsp;
    <b>E</b> Interact &nbsp; · &nbsp;
    <b>O</b> Outfit
  </div>

</div>

<!-- MINIMAP -->
<div class="minimap">
  <canvas id="mini"></canvas>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- DIALOG -->
<div class="dialog" id="dialog">
  <div class="dialogName" id="dialogName">Cloudhaven</div>
  <div class="dialogText" id="dialogText"></div>
  <div class="dialogHint">Press E to close</div>
</div>

</div>

<script>

/* =====================================================
   CELESTIA
   MAP 01 — CLOUDHAVEN
===================================================== */

const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");

const mini = document.getElementById("mini");
const mctx = mini.getContext("2d");

let W,H;

function resize(){
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  mini.width = 164;
  mini.height = 109;
}

resize();
addEventListener("resize",resize);


/* ================= WORLD ================= */

const WORLD = {
  width:3600,
  height:2400
};

const player = {
  x:1800,
  y:1420,
  speed:3.1,
  size:24,
  direction:"down"
};

let camera = {
  x:0,
  y:0
};

let keys = {};

addEventListener("keydown",e=>{

  keys[e.key.toLowerCase()] = true;

  if(e.key.toLowerCase()==="o"){
    toggleOutfit();
  }

  if(e.key.toLowerCase()==="e"){
    interact();
  }

});

addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()] = false;
});


/* ================= RANDOM HELPERS ================= */

function rand(min,max){
  return Math.random()*(max-min)+min;
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}


/* ================= DECORATIONS ================= */

const trees=[];
const flowers=[];
const clouds=[];
const houses=[];
const npcs=[];

for(let i=0;i<120;i++){

  trees.push({
    x:rand(150,3450),
    y:rand(180,2250),
    size:rand(28,52)
  });

}

for(let i=0;i<180;i++){

  flowers.push({
    x:rand(120,3480),
    y:rand(180,2250),
    type:Math.floor(rand(0,4))
  });

}

for(let i=0;i<35;i++){

  clouds.push({
    x:rand(0,WORLD.width),
    y:rand(0,800),
    size:rand(80,220),
    speed:rand(.05,.18)
  });

}


/* ================= LANDMARKS ================= */

const landmarks=[

  {
    x:1800,
    y:370,
    w:600,
    h:430,
    name:"Celestia Castle",
    type:"castle"
  },

  {
    x:700,
    y:750,
    w:750,
    h:800,
    name:"Whispering Forest",
    type:"forest"
  },

  {
    x:1850,
    y:1080,
    w:500,
    h:400,
    name:"Central Plaza",
    type:"plaza"
  },

  {
    x:2700,
    y:900,
    w:720,
    h:700,
    name:"Cloudhaven Village",
    type:"village"
  },

  {
    x:2860,
    y:1750,
    w:500,
    h:400,
    name:"Your Home",
    type:"home"
  },

  {
    x:2050,
    y:1900,
    w:650,
    h:300,
    name:"Pet Garden",
    type:"pet"
  },

  {
    x:750,
    y:1880,
    w:600,
    h:350,
    name:"Sky Dock",
    type:"dock"
  },

  {
    x:1750,
    y:2210,
    w:500,
    h:180,
    name:"Starfall Bridge",
    type:"bridge"
  }

];


/* ================= HOUSES ================= */

houses.push(
  {x:2780,y:980,color:"#8e72b9"},
  {x:3060,y:1050,color:"#d184a9"},
  {x:3300,y:950,color:"#6d91bb"},
  {x:2860,y:1760,color:"#7865a9"}
);


/* ================= PLAYERS ================= */

npcs.push(
  {
    x:1600,
    y:1250,
    name:"Luna",
    icon:"⭐",
    color:"#d6a5eb"
  },
  {
    x:2050,
    y:1310,
    name:"Alya",
    icon:"⭐",
    color:"#f0b0d1"
  },
  {
    x:2200,
    y:1480,
    name:"Mika",
    icon:"⭐",
    color:"#9dc4e9"
  }
);


/* ================= COLLISION ================= */

function blocked(x,y){

  if(x<90 || y<120 || x>WORLD.width-90 || y>WORLD.height-90)
    return true;

  return false;
}


/* ================= MOVEMENT ================= */

function update(){

  let dx=0;
  let dy=0;

  if(keys["w"] || keys["arrowup"]){
    dy=-1;
    player.direction="up";
  }

  if(keys["s"] || keys["arrowdown"]){
    dy=1;
    player.direction="down";
  }

  if(keys["a"] || keys["arrowleft"]){
    dx=-1;
    player.direction="left";
  }

  if(keys["d"] || keys["arrowright"]){
    dx=1;
    player.direction="right";
  }

  if(dx || dy){

    const length=Math.hypot(dx,dy);

    dx/=length;
    dy/=length;

    const nx=player.x+dx*player.speed;
    const ny=player.y+dy*player.speed;

    if(!blocked(nx,player.y)) player.x=nx;
    if(!blocked(player.x,ny)) player.y=ny;

  }

  camera.x=player.x-W/2;
  camera.y=player.y-H/2;

  camera.x=clamp(camera.x,0,WORLD.width-W);
  camera.y=clamp(camera.y,0,WORLD.height-H);

}


/* ================= DRAW HELPERS ================= */

function screenX(x){
  return x-camera.x;
}

function screenY(y){
  return y-camera.y;
}


/* ================= BACKGROUND ================= */

function drawBackground(){

  const grad=ctx.createLinearGradient(0,0,0,H);

  grad.addColorStop(0,"#78a9c7");
  grad.addColorStop(.55,"#a9cde0");
  grad.addColorStop(1,"#d9c4e6");

  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);

}


/* ================= CLOUDS ================= */

function drawClouds(){

  ctx.fillStyle="rgba(255,244,248,.78)";

  for(const c of clouds){

    const x=screenX(c.x);
    const y=screenY(c.y);

    if(x<-300 || x>W+300) continue;

    ctx.beginPath();

    ctx.arc(x,y,c.size*.35,0,Math.PI*2);
    ctx.arc(x+c.size*.28,y-20,c.size*.3,0,Math.PI*2);
    ctx.arc(x+c.size*.55,y,c.size*.4,0,Math.PI*2);

    ctx.fill();

  }

}


/* ================= ISLAND ================= */

function drawIsland(){

  const x=screenX(1800);
  const y=screenY(1200);

  ctx.save();

  ctx.fillStyle="#5c456d";

  ctx.beginPath();

  ctx.moveTo(x-1700,y-1050);
  ctx.lineTo(x+1650,y-1050);
  ctx.lineTo(x+1750,y+850);
  ctx.lineTo(x+1300,y+1080);
  ctx.lineTo(x-1200,y+1090);
  ctx.lineTo(x-1750,y+850);
  ctx.closePath();

  ctx.fill();

  /* grass */

  ctx.fillStyle="#78a66e";

  ctx.beginPath();

  ctx.roundRect(
    x-1720,
    y-1080,
    3440,
    1920,
    80
  );

  ctx.fill();

  /* grass patches */

  ctx.fillStyle="#92bc79";

  for(let i=0;i<35;i++){

    const px=x-1650+Math.random()*3300;
    const py=y-980+Math.random()*1700;

    ctx.fillRect(px,py,rand(40,100),rand(12,25));

  }

  ctx.restore();

}


/* ================= PATHS ================= */

function drawPaths(){

  ctx.fillStyle="#d9c6a8";

  /* castle path */

  ctx.fillRect(
    screenX(1750),
    screenY(700),
    100,
    850
  );

  /* village path */

  ctx.fillRect(
    screenX(1850),
    screenY(1200),
    1150,
    90
  );

  /* bridge path */

  ctx.fillRect(
    screenX(1500),
    screenY(2100),
    800,
    80
  );

  /* plaza */

  ctx.beginPath();

  ctx.arc(
    screenX(1950),
    screenY(1300),
    230,
    0,
    Math.PI*2
  );

  ctx.fill();

}


/* ================= TREES ================= */

function drawTrees(){

  for(const t of trees){

    const x=screenX(t.x);
    const y=screenY(t.y);

    if(x<-100 || y<-100 || x>W+100 || y>H+100) continue;

    ctx.fillStyle="#604432";
    ctx.fillRect(
      x-t.size*.11,
      y,
      t.size*.22,
      t.size*.65
    );

    ctx.fillStyle="#386c56";

    ctx.beginPath();
    ctx.arc(x,y,t.size*.48,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#5e8d62";

    ctx.beginPath();
    ctx.arc(
      x-t.size*.25,
      y-t.size*.1,
      t.size*.27,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* ================= FLOWERS ================= */

function drawFlowers(){

  const colors=[
    "#f7b4cf",
    "#cdb3ef",
    "#f5dc91",
    "#a9d6d2"
  ];

  flowers.forEach(f=>{

    const x=screenX(f.x);
    const y=screenY(f.y);

    if(x<0||y<0||x>W||y>H)return;

    ctx.fillStyle=colors[f.type];

    ctx.fillRect(x,y,4,4);
    ctx.fillRect(x-4,y+3,4,4);
    ctx.fillRect(x+4,y+3,4,4);
    ctx.fillRect(x,y+7,4,4);

    ctx.fillStyle="#f7e49a";
    ctx.fillRect(x,y+3,4,4);

  });

}


/* ================= CASTLE ================= */

function drawCastle(){

  const x=screenX(1800);
  const y=screenY(420);

  ctx.save();

  /* castle body */

  ctx.fillStyle="#eee0db";

  ctx.fillRect(x-230,y+80,460,270);

  /* towers */

  const towers=[
    -210,-95,95,210
  ];

  towers.forEach(tx=>{

    ctx.fillStyle="#e7d7d9";
    ctx.fillRect(x+tx-40,y+5,80,300);

    ctx.fillStyle="#65507e";

    ctx.beginPath();
    ctx.moveTo(x+tx-55,y+10);
    ctx.lineTo(x+tx,y-75);
    ctx.lineTo(x+tx+55,y+10);
    ctx.closePath();
    ctx.fill();

  });

  /* roof */

  ctx.fillStyle="#66517f";

  ctx.beginPath();

  ctx.moveTo(x-255,y+90);
  ctx.lineTo(x,y-10);
  ctx.lineTo(x+255,y+90);

  ctx.closePath();

  ctx.fill();

  /* door */

  ctx.fillStyle="#51364e";

  ctx.beginPath();
  ctx.roundRect(x-35,y+240,70,110,35);
  ctx.fill();

  /* windows */

  ctx.fillStyle="#ffe9a8";

  for(let i=-2;i<=2;i++){

/* ================= CHARACTER ================= */

let outfit={
  hair:"brown",
  dress:"lavender",
  accessory:"flower"
};

function drawCharacter(x,y,isCreator=true){

  ctx.save();

  /* shadow */

  ctx.fillStyle="rgba(50,30,60,.25)";

  ctx.beginPath();
  ctx.ellipse(x,y+31,25,9,0,0,Math.PI*2);
  ctx.fill();

  /* body */

  let dressColor="#bda7df";

  if(outfit.dress==="pink") dressColor="#e7a7c5";
  if(outfit.dress==="blue") dressColor="#9fc8df";
  if(outfit.dress==="cream") dressColor="#eee0c8";

  ctx.fillStyle=dressColor;

  ctx.beginPath();

  ctx.moveTo(x-21,y+5);
  ctx.lineTo(x-30,y+39);
  ctx.lineTo(x+30,y+39);
  ctx.lineTo(x+21,y+5);
  ctx.closePath();

  ctx.fill();

  /* legs */

  ctx.fillStyle="#ead6d4";

  ctx.fillRect(x-12,y+37,8,13);
  ctx.fillRect(x+4,y+37,8,13);

  /* hair */

  let hairColor="#5c3b36";

  if(outfit.hair==="black")hairColor="#282436";
  if(outfit.hair==="purple")hairColor="#76547f";
  if(outfit.hair==="pink")hairColor="#a9627c";

  ctx.fillStyle=hairColor;

  ctx.beginPath();

  ctx.arc(x,y-8,28,0,Math.PI*2);

  ctx.fill();

  /* face */

  ctx.fillStyle="#ffe1d0";

  ctx.beginPath();

  ctx.arc(x,y-5,19,0,Math.PI*2);

  ctx.fill();

  /* eyes */

  ctx.fillStyle="#49313c";

  ctx.fillRect(x-8,y-8,5,7);
  ctx.fillRect(x+4,y-8,5,7);

  /* blush */

  ctx.fillStyle="#ed9cae";
  ctx.fillRect(x-15,y+2,5,3);
  ctx.fillRect(x+10,y+2,5,3);

  /* hair bangs */

  ctx.fillStyle=hairColor;

  ctx.beginPath();

  ctx.moveTo(x-25,y-15);
  ctx.quadraticCurveTo(x,y-37,x+24,y-14);
  ctx.lineTo(x+17,y-5);
  ctx.lineTo(x+8,y-17);
  ctx.lineTo(x,y-6);
  ctx.lineTo(x-8,y-17);
  ctx.lineTo(x-17,y-6);
  ctx.closePath();

  ctx.fill();

  /* accessory */

  if(outfit.accessory==="flower"){

    ctx.fillStyle="#f4b2cf";
    ctx.fillRect(x+18,y-25,7,7);
    ctx.fillStyle="#fff0a8";
    ctx.fillRect(x+20,y-23,3,3);

  }

  if(outfit.accessory==="bow"){

    ctx.fillStyle="#ee9fbd";
    ctx.fillRect(x+16,y-25,9,8);
    ctx.fillRect(x+25,y-25,9,8);

  }

  if(outfit.accessory==="crown"){

    ctx.fillStyle="#ffd86b";

    ctx.beginPath();

    ctx.moveTo(x-13,y-31);
    ctx.lineTo(x-8,y-44);
    ctx.lineTo(x,y-35);
    ctx.lineTo(x+8,y-44);
    ctx.lineTo(x+13,y-31);
    ctx.closePath();

    ctx.fill();

  }

  if(outfit.accessory==="star"){

    ctx.fillStyle="#fff0a5";
    ctx.font="18px serif";
    ctx.fillText("★",x+17,y-25);

  }

  ctx.restore();

}

/* ================= LABELS ================= */

function label(text,x,y){

  ctx.save();

  ctx.font="700 12px DM Sans";

  const width=ctx.measureText(text).width+25;

  ctx.fillStyle="rgba(62,45,86,.86)";

  ctx.beginPath();
  ctx.roundRect(
    x-width/2,
    y-16,
    width,
    30,
    10
  );

  ctx.fill();

  ctx.fillStyle="#fff";
  ctx.textAlign="center";
  ctx.fillText(text,x,y+4);

  ctx.restore();

}

/* ================= INTERACTION ================= */

function nearest(){

  let nearest=null;
  let distance=Infinity;

  npcs.forEach(n=>{

    const d=Math.hypot(
      player.x-n.x,
      player.y-n.y
    );

    if(d<120 && d<distance){

      distance=d;
      nearest=n;

    }

  });

  return nearest;
}

function interact(){

  const npc=nearest();

  if(document.getElementById("dialog").classList.contains("show")){

    document.getElementById("dialog").classList.remove("show");
    return;

  }

  if(npc){

    openDialog(
      npc.name,
      "Hii! ✨ Welcome to Cloudhaven! Aku baru saja menemukan tempat cantik di dekat castle. Mau jalan bareng?"
    );

    return;

  }

  const dx=player.x-2860;
  const dy=player.y-1760;

  if(Math.hypot(dx,dy)<150){

    openDialog(
      "Your Home",
      "Rumahmu masih kecil, tapi suatu hari nanti kamu bisa menghiasnya sesuka hati. 🏡💗"
    );

    return;

  }

  if(Math.hypot(
    player.x-2360,
    player.y-1900
  )<130){

    openDialog(
      "Pet Garden",
      "A tiny bunny is looking at you... 🐰✨"
    );

    return;

  }

  openDialog(
    "Cloudhaven",
    "The breeze feels soft today. Somewhere beyond the clouds, another island is waiting..."
  );

}

function openDialog(name,text){

  document.getElementById("dialogName").textContent=name;
  document.getElementById("dialogText").textContent=text;

  document.getElementById("dialog").classList.add("show");

}


/* ================= INTERACTION UI ================= */

function updateInteraction(){

  const npc=nearest();
  const box=document.getElementById("interactBox");

  if(npc){

    box.classList.add("show");
    box.innerHTML=`Press <b>E</b> to talk to ${npc.name}`;

  }else{

    box.classList.remove("show");

  }

}

function toggleOutfit(){

}

function setupOptions(id,key){

  document
    .querySelectorAll(`#${id} .option`)
    .forEach(btn=>{

      btn.addEventListener("click",()=>{

        document
          .querySelectorAll(`#${id} .option`)
          .forEach(x=>x.classList.remove("active"));

        btn.classList.add("active");

        outfit[key]=btn.dataset.value;

        updatePreview();

      });

    });

}

setupOptions("accessoryOptions","accessory");

  pc.beginPath();

  pc.fill();

  pc.fillStyle="#ffe1d0";
  pc.beginPath();
  pc.arc(50,49,20,0,Math.PI*2);
  pc.fill();

  pc.fillStyle="#49313c";
  pc.fillRect(41,45,5,7);
  pc.fillRect(55,45,5,7);

  pc.fillStyle=hc;
  pc.beginPath();
  pc.moveTo(26,40);
  pc.quadraticCurveTo(50,13,74,40);
  pc.lineTo(66,50);
  pc.lineTo(58,35);
  pc.lineTo(50,47);

/* ================= TOAST ================= */

function toast(text){

  const t=document.getElementById("toast");

  t.textContent=text;
  t.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    t.classList.remove("show");
  },2200);

}

function saveOutfit(){

  localStorage.setItem(
    "celestiaOutfit",
    JSON.stringify(outfit)
  );

  toast("✨ Outfit kamu sudah disimpan!");

}

const savedOutfit=localStorage.getItem("celestiaOutfit");

if(savedOutfit){

  try{
    outfit=JSON.parse(savedOutfit);
  }catch{}

}
